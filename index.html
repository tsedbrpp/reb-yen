<body>

      solitude: 'images/solitude.jpg',
      takeMeCrazy: 'images/take_me_crazy.jpg',
      crawledEdge: 'images/crawled_edge.jpg',
      areYouListening: 'images/are_you_listening.jpg',

    function Navbar() {
      const [open, setOpen] = useState(false);
      return (
        <header className="navbar">

    function Record({ playing, onClick }) {
      const grooves = [];
      for (let r = 46; r > 20; r -= 2.2) grooves.push(<circle key={r} cx="50" cy="50" r={r} fill="none" stroke={r % 4 < 2 ? '#2a2a2a' : '#1a1a1a'} strokeWidth="0.6" />);
      return (
        <button className={'record-wrap' + (playing ? ' playing' : '')} onClick={onClick} aria-label={playing ? 'Hide the Bandcamp player' : 'Play Reb Yen on Bandcamp'}>
          <svg className="record" viewBox="0 0 100 100" aria-hidden="true">
            <defs><path id="labelArc" d="M50,50 m-12,0 a12,12 0 1,1 24,0 a12,12 0 1,1 -24,0" /></defs>
            <circle cx="50" cy="50" r="49" fill="#0d0d0d" />
            {grooves}
            <path d="M18 30 A38 38 0 0 1 40 13" stroke="rgba(255,255,255,.18)" strokeWidth="3" fill="none" strokeLinecap="round" />
            <circle cx="50" cy="50" r="18" fill="#e0703a" />
            <circle cx="50" cy="50" r="16.5" fill="none" stroke="#f2e2c4" strokeWidth="0.4" />
            <text fontFamily="Rye, serif" fontSize="6" fontWeight="700" fill="#f5efe3" letterSpacing="0.6"><textPath href="#labelArc" startOffset="2%">REB YEN • ORIGINALS • REB YEN •</textPath></text>
            <text x="50" y="52" textAnchor="middle" fontFamily="Caveat, cursive" fontSize="6.5" fill="#f5efe3">Reb Yen</text>
            <circle cx="50" cy="50" r="1.4" fill="#f5efe3" />
          </svg>
          <svg className="tonearm" viewBox="0 0 22 150" aria-hidden="true">
            <circle cx="11" cy="11" r="9" fill="#5a2d54" stroke="#f2e2c4" strokeWidth="1.5" />
            <rect x="9.5" y="11" width="3" height="125" fill="#c9b18f" />
            <rect x="5" y="132" width="12" height="16" rx="2" fill="#3b2a1e" />
          </svg>
        </button>
      );
    }

    function NightSky() {
      const ref = React.useRef(null);
      useEffect(() => {
        const cv = ref.current, ctx = cv.getContext('2d');
        const h = new Date().getHours();
        const night = (h >= 19 || h < 5) ? 1 : (h >= 17 || h < 7) ? 0.6 : 0.25;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let W, H, stars = [], shoot = null, raf = 0, visible = true, last = 0;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const size = () => {
          W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const n = Math.round(W * H / 5000);
          stars = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.75, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28, s: Math.random() * 1.5 + 0.5 }));
        };
        const draw = (t) => {
          ctx.clearRect(0, 0, W, H);
          for (const st of stars) {
            const tw = reduce ? 0.8 : 0.55 + 0.45 * Math.sin(st.p + t * 0.001 * st.s);
            ctx.globalAlpha = night * tw * (1 - st.y / (H * 0.9));
            ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.28); ctx.fill();
          }
          if (!reduce) {
            if (!shoot && t - last > 6000 && Math.random() < 0.01) { shoot = { x: Math.random() * W * 0.7, y: Math.random() * H * 0.3, l: 0 }; last = t; }
            if (shoot) {
              shoot.l += 0.02; const len = 120, dx = shoot.x + shoot.l * 600, dy = shoot.y + shoot.l * 260;
              const g = ctx.createLinearGradient(dx, dy, dx - len, dy - len * 0.43);
              g.addColorStop(0, 'rgba(255,246,224,' + (night * (1 - shoot.l)) + ')'); g.addColorStop(1, 'rgba(255,246,224,0)');
              ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx - len, dy - len * 0.43); ctx.stroke();
              if (shoot.l >= 1) shoot = null;
            }
          }
          ctx.globalAlpha = 1;
        };
        const loop = (t) => { draw(t); if (visible) raf = requestAnimationFrame(loop); };
        size();
        if (reduce) { draw(0); } else raf = requestAnimationFrame(loop);
        const io = new IntersectionObserver(([e]) => { const was = visible; visible = e.isIntersecting; if (visible && !was && !reduce) raf = requestAnimationFrame(loop); if (!visible) cancelAnimationFrame(raf); });
        io.observe(cv);
        const onR = () => { size(); if (reduce) draw(0); };
        window.addEventListener('resize', onR);
        return () => { cancelAnimationFrame(raf); io.disconnect(); window.removeEventListener('resize', onR); };
      }, []);
      return <canvas className="sky" ref={ref} aria-hidden="true"></canvas>;
    }

    function Hero({ playing, onRecord }) {
      const bgRef = React.useRef(null);
      useEffect(() => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        let ticking = false;
        const onScroll = () => {
          if (ticking) return; ticking = true;
          requestAnimationFrame(() => {
            const y = window.scrollY;
            if (bgRef.current && y < window.innerHeight * 1.2) bgRef.current.style.transform = `translate3d(0, ${y * 0.3}px, 0)`;
            ticking = false;
          });
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <section className="hero" id="home" aria-labelledby="hero-title">
          <div className="hero-bg" ref={bgRef} aria-hidden="true" style={{ backgroundImage: `linear-gradient(90deg, #2a1529 0%, #2a1529 50%, rgba(42,21,41,0.6) 60%, rgba(42,21,41,0) 75%), linear-gradient(160deg, rgba(59,31,58,0.7) 0%, rgba(90,45,84,0.45) 50%, rgba(224,112,58,0.45) 100%), url(${images.heroGuitar})`, backgroundSize: '100% 100%, 100% 100%, auto 112%', backgroundPosition: 'center, center, 100% 20%', backgroundRepeat: 'no-repeat', backgroundColor: '#2a1529' }}></div>

          <div className="hero-content">
            <Record playing={playing} onClick={onRecord} />

            <p className="sr-only" aria-live="polite">{playing ? 'Bandcamp player opened.' : ''}</p>
            <h1 id="hero-title">Reb Yen</h1>
            <p className="tagline">Singer • Songwriter • Multi-Instrumentalist</p>
            <p className="location">Boulder, Colorado & Orlando, Florida</p>
            <div className="hero-buttons">
              <a href="#music" className="btn btn-primary">Listen to Originals</a>
              <a href="#contact" className="btn">Book a Show</a>
            </div>
          </div>

    function About() {
      return (
        <section id="about" className="section">
          <div className="container">
            <h2 className="section-title">About the Artist</h2>
            <p className="section-subtitle">Songwriter first. Performer always.</p>

                <img src={images.profile} alt="Reb Yen, singer-songwriter with guitar" />

              <div className="about-text">
                <h3>Original Songs, Authentic Voice</h3>
                <p>Reb Yen is a singer, songwriter, and multi-instrumentalist whose original songs have earned Featured Artist placement on ReverbNation. Every track is written, arranged, and performed by Reb herself — with a little help from friends on select recordings.</p>
                <p>Playing guitar, banjo, keyboard, and harmonica, she moves fluidly between Americana, folk, country, indie, pop, and rock. Fans and critics describe her as a strong vocalist and a real pro who can perform solo, as a duo, or with a full band.</p>
                <p>Her path in entertainment spans decades: from the Aman World Music & Dance Ensemble (touring internationally and performing at Lincoln Center) to Walt Disney World, Universal Studios, Hard Rock Café, and the songwriting rooms of Nashville’s Commodore Grille. After a period caring for her late husband, she returned to songwriting with renewed purpose.</p>
                <div className="highlights">

                  <div className="highlight"><strong>Multi-Genre</strong><br />Americana to Rock</div>
                  <div className="highlight"><strong>Live Ready</strong><br />Solo • Duo • Band</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function FlipCard({ song, info }) {
      const [f, setF] = useState(false);
      const toggle = () => setF(!f);
      const url = info ? 'https://rebyen.bandcamp.com/track/' + info.slug : 'https://rebyen.bandcamp.com';
      const play = (e) => {
        e.stopPropagation();
        if (info && info.id) { e.preventDefault(); window.dispatchEvent(new CustomEvent('play-track', { detail: { id: info.id, title: song.title.replace('?', '') } })); }
      };
      return (
        <div className={'song-card flip' + (f ? ' flipped' : '')} role="button" tabIndex="0" aria-pressed={f}
          aria-label={song.title + (f ? ' — showing lyrics' : ' — flip for lyrics')} onClick={toggle}
          onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(); } }}>
          <div className="flip-inner">
            <div className="flip-face flip-front" aria-hidden={f}>
              <h4>{song.title}</h4>
              <p>{song.note} • {song.duration}</p>
              <span className="flip-hint">{info && info.lines ? 'Flip for lyrics ↻' : 'Flip to play ↻'}</span>

            <div className="flip-face flip-back" aria-hidden={!f}>

            </div>
          </div>
        </div>
      );
    }

      const LYR = {"Take Me Crazy": {"slug": "take-me-crazy", "id": "1827482453", "lines": ["So, Take me, Take me, If you can", "Take me, Take me, As I am"]}, "Should I?": {"slug": "should-i", "id": "235047036", "lines": ["Fact or fiction,  Words were heard,", "Words were felt, Just never said.", "Should I follow,  Should I stay,", "Should I run the other way"]}, "Gotta Let It Go": {"slug": "gotta-let-it-go-2", "id": "4028698566", "lines": ["Hey there sista what ya doing", "Why you never have no time for me", "Hey there sister, what ya thinking", "The man is taken his heart ain't free"]}, "The Solitude": {"slug": "the-solitude-live", "id": "1271869476", "lines": ["The solitude, the lonely skies", "The hidden secrets, in your eyes", "It can’t confine, the endless time", "The road ahead, plays on your mind"]}, "A New Beginning": {"slug": "a-new-beginning", "id": "1638570894", "lines": ["All these years in the blink of an eye", "All these years don’t say goodbye", "Don’t call it the end; it’s a new beginning"]}, "Are You Listening Now?": {"slug": "are-you-listening-now", "id": "3496903015", "lines": ["Are you listening now, are you humming along,", "do you feel the sound", "Gotta be your own fan, when nobody else… can"]}, "Birds Of Prey": {"slug": "birds-of-prey-live", "id": "1698636065", "lines": ["Birds of prey, what do you need today", "My likes, my praise, to make it though the day.", "Take what you need, and fly away"]}, "Take A Stand": {"slug": "take-a-stand-live", "id": "1560882348", "lines": ["Who’s gonna be the one. Who’s gonna get it done.", "Who’s gonna make a plan.  Who’s gonna take a stand."]}};

      const videos = [
        { id: '9mVyHu0EO84', title: 'The Storm (Original)', desc: 'Live at Bricks On Main' },

      return (
        <section id="music" className="section alt">
          <div className="container">

                <div className="video-card" key={i}>

                    <h4>{v.title}</h4>
                    <p>{v.desc}</p>
                  </div>
                </div>
              ))}
            </div>
            <p className="cta-row">
              <a href="https://www.youtube.com/@RebYenMusic" className="btn" target="_blank" rel="noopener noreferrer">More Live Videos on YouTube</a>
            </p>
          </div>
        </section>
      );
    }

    function Gallery() {
      const galleryImages = [
        { src: images.storm, alt: 'Reb Yen performing The Storm live with band under purple lights', caption: 'The Storm, live' },
        { src: images.takeMeCrazy, alt: 'Reb Yen live in Nashville at the Commodore Grille performing Take Me Crazy', caption: 'Nashville, Commodore Grille' },
        { src: images.crawledEdge, alt: 'Reb Yen and Lenny Charles at Roots Music Project', caption: 'w/ Lenny Charles, Roots Music Project' },
        { src: images.countingstars, alt: 'Reb Yen covering Counting Stars solo acoustic in Boulder', caption: 'Solo acoustic, Boulder' },
        { src: images.areYouListening, alt: 'Reb Yen trio live at The Alley', caption: 'Trio at The Alley' },
        { src: images.hurt, alt: 'Reb Yen performing a cover live', caption: 'Live cover' },
        { src: images.solitude, alt: 'Reb Yen performing The Solitude', caption: 'The Solitude' },
        { src: images.profile, alt: 'Portrait of Reb Yen with guitar', caption: 'Reb & her guitar' }
      ];
      const tilts = [-4, 3, -2, 5, -5, 2, 4, -3];
      const drops = [0, 14, -6, 8, 18, -4, 10, 2];
      const [active, setActive] = useState(null);
      useEffect(() => {
        if (active === null) return;
        const onKey = (e) => { if (e.key === 'Escape') setActive(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [active]);
      const cur = active !== null ? galleryImages[active] : null;

      return (
        <section id="gallery" className="section">
          <div className="container">
            <h2 className="section-title">Gallery</h2>
            <p className="section-subtitle">Moments from live shows and performances</p>
            <div className="gallery-grid polaroids">
              {galleryImages.map((img, i) => (
                <figure className="polaroid" key={i} tabIndex="0" role="button" aria-label={'Enlarge: ' + img.caption}
                  style={{ '--tilt': tilts[i % tilts.length] + 'deg', '--drop': drops[i % drops.length] + 'px' }}
                  onClick={() => setActive(i)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setActive(i); } }}>
                  <img src={img.src} alt={img.alt} loading="lazy" />
                  <figcaption>{img.caption}</figcaption>
                </figure>
              ))}
            </div>
            {cur && (
              <div className="lightbox" role="dialog" aria-modal="true" aria-label={cur.caption} onClick={() => setActive(null)}>
                <figure style={{ '--tilt': tilts[active % tilts.length] + 'deg' }}>
                  <img src={cur.src} alt={cur.alt} />
                  <figcaption>{cur.caption}</figcaption>
                </figure>
              </div>
            )}
          </div>
        </section>
      );
    }

    function Live() {
      return (
        <section id="live" className="section alt">
          <div className="container">
            <h2 className="section-title">Live & Available</h2>
            <p className="section-subtitle">Solo acoustic, duo, or full band. Originals and carefully chosen covers.</p>
            <div className="venues">
              <div className="venue">
                <h4>Boulder, Colorado</h4>
                <p>Roots Music Project<br />St. Julien Hotel<br />Bricks On Main<br />The Alley<br />Attic Bistro</p>
              </div>
              <div className="venue">
                <h4>Orlando & Central Florida</h4>
                <p>Walt Disney World<br />Universal Studios<br />Hard Rock Café<br />Local venues & private events</p>
              </div>
              <div className="venue">
                <h4>Past Highlights</h4>
                <p>Lincoln Center (Aman Ensemble)<br />Nashville Commodore Grille<br />European tours<br />Magic & performance art (as Rebekah Yen)</p>
              </div>
            </div>
            <p className="live-note">
              Available for venues, private events, festivals, and songwriting collaborations.<br />
              <strong>Formats:</strong> Solo acoustic • Duo • Full band
            </p>
          </div>
        </section>
      );
    }

    function Contact() {
      const formRef = React.useRef(null);
      const stampThen = (done) => {
        const f = formRef.current;
        if (!f || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { done(); return; }
        f.classList.remove('thump'); void f.offsetWidth; f.classList.add('thump');
        setTimeout(() => { f.classList.remove('thump'); done(); }, 600);
      };
      return (
        <section id="contact" className="section">
          <div className="container">
            <h2 className="section-title">Contact & Booking</h2>
            <p className="section-subtitle">Interested in booking Reb Yen or collaborating on a song? Reach out.</p>
            <form className="contact-form postcard" ref={formRef} onSubmit={(e) => { e.preventDefault(); stampThen(() => { alert('Thank you! In a real site this would send your message.'); }); }}>
              <div className="pc-stamp" aria-hidden="true">
                <svg viewBox="0 0 80 100"><rect width="80" height="100" fill="#3b1f3a"/><rect y="45" width="80" height="55" fill="#e0703a"/><circle cx="40" cy="58" r="17" fill="#f2e2c4"/><path d="M0 100 L0 72 L22 50 L36 64 L52 44 L80 74 L80 100 Z" fill="#5a2d54"/><circle cx="18" cy="16" r="1.6" fill="#3fa7a0"/><circle cx="60" cy="12" r="1.2" fill="#3fa7a0"/><circle cx="46" cy="26" r="1" fill="#f2e2c4"/><text x="40" y="94" textAnchor="middle" fontFamily="Rye, serif" fontSize="8" fill="#f2e2c4">REB YEN</text></svg>
              </div>
              <div className="pc-postmark" aria-hidden="true">BOULDER<br/>COLORADO<br/>★ 2026 ★</div>
              <div className="pc-msg">
              <div className="pc-head">Greetings from…</div>
              <div className="form-group">
                <label htmlFor="message">Message</label>
                <textarea id="message" name="message" required></textarea>
              </div>
              </div>
              <div className="pc-addr">
              <div className="pc-head">To: Reb Yen</div>
              <div className="form-group">
                <label htmlFor="name">Name</label>
                <input type="text" id="name" name="name" required />
              </div>
              <div className="form-group">
                <label htmlFor="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div className="form-group">
                <label htmlFor="subject">Subject</label>
                <select id="subject" name="subject">
                  <option>Booking Inquiry</option>
                  <option>Songwriting Collaboration</option>
                  <option>General Message</option>
                  <option>Press / Media</option>
                </select>
              </div>
              <button type="submit" className="btn btn-primary full-width">Send Message</button>
              </div>
            </form>
            <p className="contact-links">
              Or connect via existing platforms:<br />
              <a href="https://www.youtube.com/@RebYenMusic" target="_blank" rel="noopener noreferrer">YouTube</a> • 
              <a href="https://rebyen.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a> • 
              <a href="https://www.reverbnation.com/rebyen" target="_blank" rel="noopener noreferrer">ReverbNation</a>
            </p>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer>
          <div className="container">
            <div className="logo">Reb Yen</div>
            <p>Singer-Songwriter | Boulder, CO & Orlando, FL</p>
            <div className="social-links">
              <a href="https://www.youtube.com/@RebYenMusic" target="_blank" rel="noopener noreferrer">YouTube</a>
              <a href="https://rebyen.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a>
              <a href="https://www.reverbnation.com/rebyen" target="_blank" rel="noopener noreferrer">ReverbNation</a>
            </div>
            <p className="copyright">© 2026 Reb Yen. All music, lyrics, and sound recordings registered with the U.S. Copyright Office. All rights reserved.<br />Website design created to highlight her original songwriting and music.</p>
          </div>
        </footer>
      );
    }

    const TRACKS = [
      { id: '1638570894', title: 'A New Beginning' },
      { id: '1827482453', title: 'Take Me Crazy' },
      { id: '235047036', title: 'Should I' },
      { id: '244119541', title: 'Out of Body' },
      { id: '4028698566', title: 'Gotta Let It Go' },
      { id: '3496903015', title: 'Are You Listening Now' },
      { id: '1560882348', title: 'Take A Stand (live)' },
      { id: '1271869476', title: 'The Solitude (live)' },
      { id: '1698636065', title: 'Birds Of Prey (live)' }
    ];

    function MiniPlayer({ open, setOpen }) {
      const [track, setTrack] = useState(0);
      const [visible, setVisible] = useState(true);
      useEffect(() => { document.body.classList.toggle('player-open', open && visible); }, [open, visible]);
      useEffect(() => { if (open) setVisible(true); }, [open]);
      useEffect(() => {
        const h = (e) => { const i = TRACKS.findIndex(t => t.id === e.detail.id); if (i >= 0) { setTrack(i); setVisible(true); setOpen(true); } };
        window.addEventListener('play-track', h); return () => window.removeEventListener('play-track', h);
      }, [setOpen]);
      if (!visible) return null;
      const t = TRACKS[track];
      return (
        <div className={'mini-player' + (open ? ' open' : '')} role="region" aria-label="Bandcamp mini player">
          <div className="mp-bar">
            <button className="mp-toggle" onClick={() => setOpen(!open)} aria-expanded={open}>
              <span className="mp-disc" aria-hidden="true"></span>
              <span className="mp-label">Now playing: <strong>Reb Yen</strong> on Bandcamp{open ? ' — ' + t.title : ''}</span>
            </button>
            <button className="mp-btn" onClick={() => setOpen(!open)} aria-label={open ? 'Minimize player' : 'Expand player'}>{open ? '–' : '+'}</button>
            <button className="mp-btn" onClick={() => { setOpen(false); setVisible(false); document.body.classList.remove('player-open'); }} aria-label="Close player">×</button>
          </div>
          {open && (
            <div className="mp-body">
              <select value={track} onChange={(e) => setTrack(Number(e.target.value))} aria-label="Choose a track">
                {TRACKS.map((tr, i) => <option key={tr.id} value={i}>{tr.title}</option>)}
              </select>
              <iframe key={t.id} title={t.title + ' by Reb Yen'} seamless
                src={`https://bandcamp.com/EmbeddedPlayer/track=${t.id}/size=small/bgcol=ffffff/linkcol=8b2f23/transparent=true/`}></iframe>
            </div>
          )}
        </div>
      );
    }

    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.section-title, .reveal');
        els.forEach(el => el.classList.add('reveal'));
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
          els.forEach(el => el.classList.add('in')); return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
        }, { threshold: 0.15 });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    }

    // Lyrics quoted verbatim from Reb's own Bandcamp track pages.
    function Lyric({ lines, song, url }) {
      return (
        <figure className="lyric reveal">
          <blockquote>{lines.map((l, i) => <div key={i}>{l}</div>)}</blockquote>
          <figcaption>— from “<a href={url} target="_blank" rel="noopener noreferrer">{song}</a>” by Reb Yen</figcaption>
        </figure>
      );
    }

    // Pins: only places named elsewhere on this site (Live section and bio).
    const PLACES = [
      { id: 'boulder', label: 'Boulder', x: 352, y: 232, title: 'Boulder, Colorado', venues: ['Roots Music Project', 'St. Julien Hotel', 'Bricks On Main', 'The Alley', 'Attic Bistro'] },
      { id: 'nashville', label: 'Nashville', x: 650, y: 318, title: 'Nashville, Tennessee', venues: ['Commodore Grille'] },
      { id: 'orlando', label: 'Orlando', x: 792, y: 482, title: 'Orlando & Central Florida', venues: ['Walt Disney World', 'Universal Studios', 'Hard Rock Café'] },
      { id: 'nyc', label: 'New York', x: 868, y: 178, title: 'New York City', venues: ['Lincoln Center (Aman Ensemble)'] }
    ];

    function TourMap() {
      const [active, setActive] = useState(null);
      const p = PLACES.find(x => x.id === active);
      return (
        <section id="map" className="section">
          <div className="container">
            <h2 className="section-title">Where Reb Has Played</h2>
            <div className="tour-map" onMouseLeave={() => setActive(null)}>
              <svg viewBox="0 0 1000 600" role="img" aria-label="Hand-drawn map of the United States with pins for Boulder, Nashville, Orlando and New York">
                <defs>
                  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="6" /></filter>
                </defs>
                <path className="us-shape" d="M70,70 L240,88 L420,100 L560,104 L600,96 L640,120 L700,128 L760,118 L800,108 L850,80 L905,60 L930,90 L915,130 L890,150 L905,165 L875,195 L860,215 L835,250 L815,290 L790,330 L765,370 L760,410 L790,460 L815,520 L805,560 L780,545 L755,490 L720,445 L660,440 L600,445 L560,470 L520,470 L500,520 L470,540 L440,500 L410,455 L360,445 L330,430 L280,440 L240,420 L200,400 L160,385 L120,350 L95,300 L70,250 L55,190 L60,120 Z" />
                <path d="M120,560 q30,-10 60,0 t60,0 t60,0" fill="none" stroke="#c9b48f" strokeWidth="2" />
                {PLACES.map(pl => (
                  <g key={pl.id} className={'pin' + (active === pl.id ? ' active' : '')} tabIndex="0" role="button" aria-label={pl.title + ': ' + pl.venues.join(', ')}
                     onMouseEnter={() => setActive(pl.id)} onFocus={() => setActive(pl.id)} onBlur={() => setActive(null)}
                     onClick={() => setActive(active === pl.id ? null : pl.id)}>
                    <circle cx={pl.x} cy={pl.y} r="24" fill="transparent" />
                    <circle className="dot" cx={pl.x} cy={pl.y} r="10" />
                    <text x={pl.x + (pl.id === 'nyc' || pl.id === 'orlando' ? -18 : 18)} y={pl.y - 14} textAnchor={pl.id === 'nyc' || pl.id === 'orlando' ? 'end' : 'start'}>{pl.label}</text>
                  </g>
                ))}
              </svg>
              {p && (
                <div className="pin-card" style={{ left: (p.x / 10) + '%', top: (p.y / 6) + '%' }}>
                  <strong>{p.title}</strong>
                  <ul>{p.venues.map(v => <li key={v}>{v}</li>)}</ul>
                </div>
              )}
            </div>
            <p className="map-note">Hover or tap a pin to see the venues. Plus European tours.</p>
          </div>
        </section>
      );
    }

    function App() {
      const [playerOpen, setPlayerOpen] = useState(window.__PLAYER_OPEN__ === true);
      useReveal();
      return (
        <>
          <Navbar />
          <Hero playing={playerOpen} onRecord={() => setPlayerOpen(!playerOpen)} />
          <About />
          <Lyric song="A New Beginning" url="https://rebyen.bandcamp.com/track/a-new-beginning"
            lines={['Don’t call it the end;', 'it’s a new beginning']} />
          <Music />
          <Lyric song="Should I?" url="https://rebyen.bandcamp.com/track/should-i"
            lines={['Should I follow, Should I stay,', 'Should I run the other way']} />
          <Gallery />
          <Live />
          <TourMap />
          <Contact />
          <Footer />
          <MiniPlayer open={playerOpen} setOpen={setPlayerOpen} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
