  <style>

    .contact-form { max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }

    textarea { min-height: 120px; resize: vertical; }
    .contact-links { text-align: center; margin-top: 2rem; color: var(--text-muted); }
    footer { background: #0a0a0a; padding: 3rem 0 1.5rem; text-align: center; border-top: 1px solid rgba(201,168,124,0.2); }

      .navbar nav.open { display: flex; }

  <style id="wow-features">
    /* Vinyl record */
    .hero-content { display:flex; flex-direction:column; align-items:center; }
    .record-wrap { position:relative; width:190px; height:190px; margin:0 auto 1.2rem; cursor:pointer; border:0; background:none; padding:0; }

    .mp-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.95rem; }

    .mp-btn { background:none; border:1px solid #7a5232; color:#7a5232; border-radius:50%; width:30px; height:30px; flex:none; cursor:pointer; font-size:1rem; line-height:1; }

    /* Polaroid gallery */
    .gallery-grid.polaroids { display:flex; flex-wrap:wrap; justify-content:center; gap:1.6rem 1.2rem; padding:1rem 0; }
    .polaroid { background:#fff; padding:12px 12px 0; width:230px; box-shadow:0 6px 16px rgba(60,30,15,.25); border:0; cursor:zoom-in; transform:rotate(var(--tilt)) translateY(var(--drop)); transition:transform .35s, box-shadow .35s; font:inherit; }
    .polaroid img { width:100%; height:200px; object-fit:cover; display:block; transition:none; }
    .polaroid:hover, .polaroid:focus-visible { transform:rotate(0) scale(1.06); box-shadow:0 14px 28px rgba(60,30,15,.35); z-index:2; position:relative; outline:none; }
    .polaroid figcaption, .lightbox figcaption { font-family:'Caveat',cursive; font-size:1.4rem; color:#3b2a1e; text-align:center; padding:.45rem .2rem .7rem; line-height:1.1; }

    @media (max-width:560px){ .polaroid { width:44%; padding:7px 7px 0; } .polaroid img { height:130px; } .polaroid figcaption { font-size:1.05rem; } }
    .lightbox { position:fixed; inset:0; z-index:1000; background:rgba(30,18,10,.82); display:flex; align-items:center; justify-content:center; cursor:zoom-out; animation:fade .25s; }
    .lightbox figure { background:#fff; padding:16px 16px 0; max-width:min(90vw,820px); box-shadow:0 20px 50px rgba(0,0,0,.5); animation:straighten .45s cubic-bezier(.3,1.3,.5,1); }

    @keyframes straighten { from { transform:rotate(var(--tilt,-4deg)) scale(.5); opacity:.3; } to { transform:none; opacity:1; } }
    @keyframes fade { from { opacity:0; } }

    @media (prefers-reduced-motion: reduce) {
      .record, .mp-disc { animation:none !important; }

    }

<body>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const images = {
      storm: 'images/storm.jpg',
      countingstars: 'images/countingstars.jpg',
      solitude: 'images/solitude.jpg',
      takeMeCrazy: 'images/take_me_crazy.jpg',
      crawledEdge: 'images/crawled_edge.jpg',
      areYouListening: 'images/are_you_listening.jpg',
      hurt: 'images/hurt.jpg',
      profile: 'images/reb_yen_photo.jpg',
      newbeginning: 'images/newbeginning.jpg'
    };

    function Navbar() {
      const [open, setOpen] = useState(false);
      return (
        <header className="navbar">
          <div className="container">
            <div className="logo">Reb Yen</div>
            <button className="menu-toggle" onClick={() => setOpen(!open)}>☰</button>
            <nav className={open ? 'open' : ''}>
              <a href="#home" onClick={() => setOpen(false)}>Home</a>
              <a href="#about" onClick={() => setOpen(false)}>About</a>
              <a href="#music" onClick={() => setOpen(false)}>Music</a>
              <a href="#gallery" onClick={() => setOpen(false)}>Gallery</a>
              <a href="#live" onClick={() => setOpen(false)}>Live</a>
              <a href="#contact" onClick={() => setOpen(false)}>Contact</a>
            </nav>
          </div>
        </header>
      );
    }

    function Record({ playing, onClick }) {
      const grooves = [];
      for (let r = 46; r > 20; r -= 2.2) grooves.push(<circle key={r} cx="50" cy="50" r={r} fill="none" stroke={r % 4 < 2 ? '#2a2a2a' : '#1a1a1a'} strokeWidth="0.6" />);
      return (
        <button className={'record-wrap' + (playing ? ' playing' : '')} onClick={onClick} aria-label={playing ? 'Hide the Bandcamp player' : 'Play Reb Yen on Bandcamp'}>
          <svg className="record" viewBox="0 0 100 100" aria-hidden="true">
            <defs><path id="labelArc" d="M50,50 m-12,0 a12,12 0 1,1 24,0 a12,12 0 1,1 -24,0" /></defs>
            <circle cx="50" cy="50" r="49" fill="#0d0d0d" />
            {grooves}
            <path d="M18 30 A38 38 0 0 1 40 13" stroke="rgba(255,255,255,.18)" strokeWidth="3" fill="none" strokeLinecap="round" />
            <circle cx="50" cy="50" r="18" fill="#8b2f23" />
            <circle cx="50" cy="50" r="16.5" fill="none" stroke="#e8c99a" strokeWidth="0.4" />
            <text fontFamily="Zilla Slab, serif" fontSize="6" fontWeight="700" fill="#f5efe3" letterSpacing="0.6"><textPath href="#labelArc" startOffset="2%">REB YEN • ORIGINALS • REB YEN •</textPath></text>
            <text x="50" y="52" textAnchor="middle" fontFamily="Caveat, cursive" fontSize="6.5" fill="#f5efe3">Reb Yen</text>
            <circle cx="50" cy="50" r="1.4" fill="#f5efe3" />
          </svg>
          <svg className="tonearm" viewBox="0 0 22 150" aria-hidden="true">
            <circle cx="11" cy="11" r="9" fill="#7a5232" stroke="#e8c99a" strokeWidth="1.5" />
            <rect x="9.5" y="11" width="3" height="125" fill="#c9b18f" />
            <rect x="5" y="132" width="12" height="16" rx="2" fill="#3b2a1e" />
          </svg>
        </button>
      );
    }

    function Hero({ playing, onRecord }) {
      return (
        <section className="hero" id="home" style={{ backgroundImage: `linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.7)), url(${images.storm})` }}>
          <div className="hero-content">
            <Record playing={playing} onClick={onRecord} />
            <p className="record-hint">{playing ? 'now spinning…' : 'drop the needle ↑'}</p>
            <h1>Reb Yen</h1>
            <p className="tagline">Singer • Songwriter • Multi-Instrumentalist</p>
            <p className="location">Boulder, Colorado & Orlando, Florida</p>
            <div className="hero-buttons">
              <a href="#music" className="btn btn-primary">Listen to Originals</a>
              <a href="#contact" className="btn">Book a Show</a>
            </div>
          </div>
        </section>
      );
    }

    function About() {
      return (
        <section id="about" className="section">
          <div className="container">
            <h2 className="section-title">About the Artist</h2>
            <p className="section-subtitle">Songwriter first. Performer always.</p>
            <div className="about-grid">
              <div className="about-img">
                <img src={images.profile} alt="Reb Yen, singer-songwriter with guitar" />
              </div>
              <div className="about-text">
                <h3>Original Songs, Authentic Voice</h3>
                <p>Reb Yen is a singer, songwriter, and multi-instrumentalist whose original songs have earned Featured Artist placement on ReverbNation. Every track is written, arranged, and performed by Reb herself — with a little help from friends on select recordings.</p>
                <p>Playing guitar, banjo, keyboard, and harmonica, she moves fluidly between Americana, folk, country, indie, pop, and rock. Fans and critics describe her as a strong vocalist and a real pro who can perform solo, as a duo, or with a full band.</p>
                <p>Her path in entertainment spans decades: from the Aman World Music & Dance Ensemble (touring internationally and performing at Lincoln Center) to Walt Disney World, Universal Studios, Hard Rock Café, and the songwriting rooms of Nashville’s Commodore Grille. After a period caring for her late husband, she returned to songwriting with renewed purpose.</p>
                <div className="highlights">
                  <div className="highlight"><strong>All Originals</strong><br />Written & arranged by Reb</div>
                  <div className="highlight"><strong>Multi-Genre</strong><br />Americana to Rock</div>
                  <div className="highlight"><strong>Live Ready</strong><br />Solo • Duo • Band</div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Music() {
      const songs = [
        { title: 'Take Me Crazy', duration: '3:48', note: 'Featured original' },
        { title: 'Should I?', duration: '3:07', note: 'Original' },
        { title: 'Gotta Let It Go', duration: '3:34', note: 'Original' },
        { title: 'The Solitude', duration: '1:34', note: 'Original (Live available)' },
        { title: 'A New Beginning', duration: '3:02', note: 'Original' },
        { title: 'Are You Listening Now?', duration: '3:09', note: 'Original' },
        { title: 'Birds Of Prey', duration: '2:37', note: 'Original (Live)' },
        { title: 'Take A Stand', duration: '3:05', note: 'Original (Live)' }
      ];

      const videos = [
        { id: '9mVyHu0EO84', title: 'The Storm (Original)', desc: 'Live at Bricks On Main' },
        { id: 'IcbPtlFYaXE', title: 'Take Me Crazy (Original)', desc: 'Live in Nashville at the Commodore Grille' },
        { id: 'bXxxfzs3QAw', title: 'Counting Stars (Cover)', desc: 'Solo acoustic in Boulder' },
        { id: '4btANinbyOo', title: 'The Solitude (Original)', desc: 'Live at Roots Music Project, Boulder' }
      ];

      return (
        <section id="music" className="section alt">
          <div className="container">
            <h2 className="section-title">Songwriting & Music</h2>
            <p className="section-subtitle">Original songs that tell stories. Listen, stream, and support independent music.</p>
            <div className="songs-grid">
              {songs.map((song, i) => (
                <div className="song-card" key={i}>
                  <h4>{song.title}</h4>
                  <p>{song.note} • {song.duration}</p>
                </div>
              ))}
            </div>
            <div className="cta-row">
              <a href="https://rebyen.bandcamp.com" className="btn btn-primary" target="_blank" rel="noopener noreferrer">Listen on Bandcamp</a>
              <a href="https://www.reverbnation.com/rebyen" className="btn" target="_blank" rel="noopener noreferrer">Full Catalog on ReverbNation</a>
            </div>
            <h3 className="subsection-title">Watch Live Performances</h3>
            <div className="embed-grid">
              {videos.map((v, i) => (
                <div className="video-card" key={i}>
                  <iframe
                    src={`https://www.youtube.com/embed/${v.id}`}
                    title={v.title}
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  ></iframe>
                  <div className="info">
                    <h4>{v.title}</h4>
                    <p>{v.desc}</p>
                  </div>
                </div>
              ))}
            </div>
            <p className="cta-row">
              <a href="https://www.youtube.com/@RebYenMusic" className="btn" target="_blank" rel="noopener noreferrer">More Live Videos on YouTube</a>
            </p>
          </div>
        </section>
      );
    }

    function Gallery() {
      const galleryImages = [
        { src: images.storm, alt: 'Reb Yen performing The Storm live with band under purple lights', caption: 'The Storm, live' },
        { src: images.takeMeCrazy, alt: 'Reb Yen live in Nashville at the Commodore Grille performing Take Me Crazy', caption: 'Nashville, Commodore Grille' },
        { src: images.crawledEdge, alt: 'Reb Yen and Lenny Charles at Roots Music Project', caption: 'w/ Lenny Charles, Roots Music Project' },
        { src: images.countingstars, alt: 'Reb Yen covering Counting Stars solo acoustic in Boulder', caption: 'Solo acoustic, Boulder' },
        { src: images.areYouListening, alt: 'Reb Yen trio live at The Alley', caption: 'Trio at The Alley' },
        { src: images.hurt, alt: 'Reb Yen performing a cover live', caption: 'Live cover' },
        { src: images.solitude, alt: 'Reb Yen performing The Solitude', caption: 'The Solitude' },
        { src: images.profile, alt: 'Portrait of Reb Yen with guitar', caption: 'Reb & her guitar' }
      ];
      const tilts = [-4, 3, -2, 5, -5, 2, 4, -3];
      const drops = [0, 14, -6, 8, 18, -4, 10, 2];
      const [active, setActive] = useState(null);
      useEffect(() => {
        if (active === null) return;
        const onKey = (e) => { if (e.key === 'Escape') setActive(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [active]);
      const cur = active !== null ? galleryImages[active] : null;

      return (
        <section id="gallery" className="section">
          <div className="container">
            <h2 className="section-title">Gallery</h2>
            <p className="section-subtitle">Moments from live shows and performances</p>
            <div className="gallery-grid polaroids">
              {galleryImages.map((img, i) => (
                <figure className="polaroid" key={i} tabIndex="0" role="button" aria-label={'Enlarge: ' + img.caption}
                  style={{ '--tilt': tilts[i % tilts.length] + 'deg', '--drop': drops[i % drops.length] + 'px' }}
                  onClick={() => setActive(i)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setActive(i); } }}>
                  <img src={img.src} alt={img.alt} loading="lazy" />
                  <figcaption>{img.caption}</figcaption>
                </figure>
              ))}
            </div>
            {cur && (
              <div className="lightbox" role="dialog" aria-modal="true" aria-label={cur.caption} onClick={() => setActive(null)}>
                <figure style={{ '--tilt': tilts[active % tilts.length] + 'deg' }}>
                  <img src={cur.src} alt={cur.alt} />
                  <figcaption>{cur.caption}</figcaption>
                </figure>
              </div>
            )}
          </div>
        </section>
      );
    }

    function Live() {
      return (
        <section id="live" className="section alt">
          <div className="container">
            <h2 className="section-title">Live & Available</h2>
            <p className="section-subtitle">Solo acoustic, duo, or full band. Originals and carefully chosen covers.</p>
            <div className="venues">
              <div className="venue">
                <h4>Boulder, Colorado</h4>
                <p>Roots Music Project<br />St. Julien Hotel<br />Bricks On Main<br />The Alley<br />Attic Bistro</p>
              </div>
              <div className="venue">
                <h4>Orlando & Central Florida</h4>
                <p>Walt Disney World<br />Universal Studios<br />Hard Rock Café<br />Local venues & private events</p>
              </div>
              <div className="venue">
                <h4>Past Highlights</h4>
                <p>Lincoln Center (Aman Ensemble)<br />Nashville Commodore Grille<br />European tours<br />Magic & performance art (as Rebekah Yen)</p>
              </div>
            </div>
            <p className="live-note">
              Available for venues, private events, festivals, and songwriting collaborations.<br />
              <strong>Formats:</strong> Solo acoustic • Duo • Full band
            </p>
          </div>
        </section>
      );
    }

    function Contact() {
      return (
        <section id="contact" className="section">
          <div className="container">
            <h2 className="section-title">Contact & Booking</h2>
            <p className="section-subtitle">Interested in booking Reb Yen or collaborating on a song? Reach out.</p>
            <form className="contact-form" onSubmit={(e) => { e.preventDefault(); alert('Thank you! In a real site this would send your message.'); }}>
              <div className="form-group">
                <label htmlFor="name">Name</label>
                <input type="text" id="name" name="name" required />
              </div>
              <div className="form-group">
                <label htmlFor="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div className="form-group">
                <label htmlFor="subject">Subject</label>
                <select id="subject" name="subject">
                  <option>Booking Inquiry</option>
                  <option>Songwriting Collaboration</option>
                  <option>General Message</option>
                  <option>Press / Media</option>
                </select>
              </div>
              <div className="form-group">
                <label htmlFor="message">Message</label>
                <textarea id="message" name="message" required></textarea>
              </div>
              <button type="submit" className="btn btn-primary full-width">Send Message</button>
            </form>
            <p className="contact-links">
              Or connect via existing platforms:<br />
              <a href="https://www.youtube.com/@RebYenMusic" target="_blank" rel="noopener noreferrer">YouTube</a> • 
              <a href="https://rebyen.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a> • 
              <a href="https://www.reverbnation.com/rebyen" target="_blank" rel="noopener noreferrer">ReverbNation</a>
            </p>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer>
          <div className="container">
            <div className="logo">Reb Yen</div>
            <p>Singer-Songwriter | Boulder, CO & Orlando, FL</p>
            <div className="social-links">
              <a href="https://www.youtube.com/@RebYenMusic" target="_blank" rel="noopener noreferrer">YouTube</a>
              <a href="https://rebyen.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a>
              <a href="https://www.reverbnation.com/rebyen" target="_blank" rel="noopener noreferrer">ReverbNation</a>
            </div>
            <p className="copyright">© 2026 Reb Yen. All music, lyrics, and sound recordings registered with the U.S. Copyright Office. All rights reserved.<br />Website design created to highlight her original songwriting and music.</p>
          </div>
        </footer>
      );
    }

    const TRACKS = [
      { id: '1638570894', title: 'A New Beginning' },
      { id: '1827482453', title: 'Take Me Crazy' },
      { id: '235047036', title: 'Should I' },
      { id: '244119541', title: 'Out of Body' },
      { id: '4028698566', title: 'Gotta Let It Go' },
      { id: '3496903015', title: 'Are You Listening Now' }
    ];

    function MiniPlayer({ open, setOpen }) {
      const [track, setTrack] = useState(0);
      const [visible, setVisible] = useState(true);
      useEffect(() => { document.body.classList.toggle('player-open', open && visible); }, [open, visible]);
      useEffect(() => { if (open) setVisible(true); }, [open]);
      if (!visible) return null;
      const t = TRACKS[track];
      return (
        <div className={'mini-player' + (open ? ' open' : '')} role="region" aria-label="Bandcamp mini player">
          <div className="mp-bar">
            <button className="mp-toggle" onClick={() => setOpen(!open)} aria-expanded={open}>
              <span className="mp-disc" aria-hidden="true"></span>
              <span className="mp-label">Now playing: <strong>Reb Yen</strong> on Bandcamp{open ? ' — ' + t.title : ''}</span>
            </button>
            <button className="mp-btn" onClick={() => setOpen(!open)} aria-label={open ? 'Minimize player' : 'Expand player'}>{open ? '–' : '+'}</button>
            <button className="mp-btn" onClick={() => { setOpen(false); setVisible(false); document.body.classList.remove('player-open'); }} aria-label="Close player">×</button>
          </div>
          {open && (
            <div className="mp-body">
              <select value={track} onChange={(e) => setTrack(Number(e.target.value))} aria-label="Choose a track">
                {TRACKS.map((tr, i) => <option key={tr.id} value={i}>{tr.title}</option>)}
              </select>
              <iframe key={t.id} title={t.title + ' by Reb Yen'} seamless
                src={`https://bandcamp.com/EmbeddedPlayer/track=${t.id}/size=small/bgcol=ffffff/linkcol=8b2f23/transparent=true/`}></iframe>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [playerOpen, setPlayerOpen] = useState(window.__PLAYER_OPEN__ === true);
      return (
        <>
          <Navbar />
          <Hero playing={playerOpen} onRecord={() => setPlayerOpen(!playerOpen)} />
          <About />
          <Music />
          <Gallery />
          <Live />
          <Contact />
          <Footer />
          <MiniPlayer open={playerOpen} setOpen={setPlayerOpen} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
